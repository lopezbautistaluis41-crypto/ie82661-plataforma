<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 165" role="img" aria-labelledby="title desc"><title id="title">Ejercicio 46: Equivalencias</title><desc id="desc">Modelo de una unidad dividida en 9 partes iguales, con 4 partes coloreadas. Busca una fracción equivalente.</desc><rect width="640" height="165" rx="18" fill="#eff7fa"/><text x="26" y="34" fill="#264453" font-family="Arial,sans-serif" font-size="17">Cantidad que debes representar: 4/9</text><rect x="26.0000" y="49" width="65.3333" height="44" fill="#1684a2" stroke="#234859" stroke-width="1.5"/><rect x="91.3333" y="49" width="65.3333" height="44" fill="#1684a2" stroke="#234859" stroke-width="1.5"/><rect x="156.6667" y="49" width="65.3333" height="44" fill="#1684a2" stroke="#234859" stroke-width="1.5"/><rect x="222.0000" y="49" width="65.3333" height="44" fill="#1684a2" stroke="#234859" stroke-width="1.5"/><rect x="287.3333" y="49" width="65.3333" height="44" fill="#ffffff" stroke="#234859" stroke-width="1.5"/><rect x="352.6667" y="49" width="65.3333" height="44" fill="#ffffff" stroke="#234859" stroke-width="1.5"/><rect x="418.0000" y="49" width="65.3333" height="44" fill="#ffffff" stroke="#234859" stroke-width="1.5"/><rect x="483.3333" y="49" width="65.3333" height="44" fill="#ffffff" stroke="#234859" stroke-width="1.5"/><rect x="548.6667" y="49" width="65.3333" height="44" fill="#ffffff" stroke="#234859" stroke-width="1.5"/><text x="26" y="149" fill="#42606d" font-family="Arial,sans-serif" font-size="14">Cada barra completa representa una unidad del mismo tamaño.</text></svg>