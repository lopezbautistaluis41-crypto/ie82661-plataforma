<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" role="img" aria-labelledby="title desc"><title id="title">Ejercicio 30: Heterogéneas</title><desc id="desc">Dos modelos con unidades del mismo tamaño: 1 de 3 partes coloreadas y 3 de 4 partes coloreadas. Operación: suma.</desc><rect width="640" height="270" rx="18" fill="#eff7fa"/><text x="26" y="34" fill="#264453" font-family="Arial,sans-serif" font-size="17">Primera cantidad: 1/3</text><rect x="26.0000" y="49" width="196.0000" height="44" fill="#1684a2" stroke="#234859" stroke-width="1.5"/><rect x="222.0000" y="49" width="196.0000" height="44" fill="#ffffff" stroke="#234859" stroke-width="1.5"/><rect x="418.0000" y="49" width="196.0000" height="44" fill="#ffffff" stroke="#234859" stroke-width="1.5"/><text x="26" y="139" fill="#264453" font-family="Arial,sans-serif" font-size="17">Segunda cantidad: 3/4</text><rect x="26.0000" y="154" width="147.0000" height="44" fill="#b08730" stroke="#234859" stroke-width="1.5"/><rect x="173.0000" y="154" width="147.0000" height="44" fill="#b08730" stroke="#234859" stroke-width="1.5"/><rect x="320.0000" y="154" width="147.0000" height="44" fill="#b08730" stroke="#234859" stroke-width="1.5"/><rect x="467.0000" y="154" width="147.0000" height="44" fill="#ffffff" stroke="#234859" stroke-width="1.5"/><text x="26" y="254" fill="#42606d" font-family="Arial,sans-serif" font-size="14">Cada barra completa representa una unidad del mismo tamaño.</text></svg>