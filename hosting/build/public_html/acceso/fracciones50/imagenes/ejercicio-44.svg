<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 165" role="img" aria-labelledby="title desc"><title id="title">Ejercicio 44: Equivalencias</title><desc id="desc">Modelo de una unidad dividida en 5 partes iguales, con 2 partes coloreadas. Busca una fracción equivalente.</desc><rect width="640" height="165" rx="18" fill="#eff7fa"/><text x="26" y="34" fill="#264453" font-family="Arial,sans-serif" font-size="17">Cantidad que debes representar: 2/5</text><rect x="26.0000" y="49" width="117.6000" height="44" fill="#1684a2" stroke="#234859" stroke-width="1.5"/><rect x="143.6000" y="49" width="117.6000" height="44" fill="#1684a2" stroke="#234859" stroke-width="1.5"/><rect x="261.2000" y="49" width="117.6000" height="44" fill="#ffffff" stroke="#234859" stroke-width="1.5"/><rect x="378.8000" y="49" width="117.6000" height="44" fill="#ffffff" stroke="#234859" stroke-width="1.5"/><rect x="496.4000" y="49" width="117.6000" height="44" fill="#ffffff" stroke="#234859" stroke-width="1.5"/><text x="26" y="149" fill="#42606d" font-family="Arial,sans-serif" font-size="14">Cada barra completa representa una unidad del mismo tamaño.</text></svg>