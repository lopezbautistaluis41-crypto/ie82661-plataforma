<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" role="img" aria-labelledby="title desc"><title id="title">Ejercicio 35: Heterogéneas</title><desc id="desc">Dos modelos con unidades del mismo tamaño: 5 de 6 partes coloreadas y 1 de 2 partes coloreadas. Operación: resta.</desc><rect width="640" height="270" rx="18" fill="#eff7fa"/><text x="26" y="34" fill="#264453" font-family="Arial,sans-serif" font-size="17">Primera cantidad: 5/6</text><rect x="26.0000" y="49" width="98.0000" height="44" fill="#1684a2" stroke="#234859" stroke-width="1.5"/><rect x="124.0000" y="49" width="98.0000" height="44" fill="#1684a2" stroke="#234859" stroke-width="1.5"/><rect x="222.0000" y="49" width="98.0000" height="44" fill="#1684a2" stroke="#234859" stroke-width="1.5"/><rect x="320.0000" y="49" width="98.0000" height="44" fill="#1684a2" stroke="#234859" stroke-width="1.5"/><rect x="418.0000" y="49" width="98.0000" height="44" fill="#1684a2" stroke="#234859" stroke-width="1.5"/><rect x="516.0000" y="49" width="98.0000" height="44" fill="#ffffff" stroke="#234859" stroke-width="1.5"/><text x="26" y="139" fill="#264453" font-family="Arial,sans-serif" font-size="17">Segunda cantidad: 1/2</text><rect x="26.0000" y="154" width="294.0000" height="44" fill="#b08730" stroke="#234859" stroke-width="1.5"/><rect x="320.0000" y="154" width="294.0000" height="44" fill="#ffffff" stroke="#234859" stroke-width="1.5"/><text x="26" y="254" fill="#42606d" font-family="Arial,sans-serif" font-size="14">Cada barra completa representa una unidad del mismo tamaño.</text></svg>