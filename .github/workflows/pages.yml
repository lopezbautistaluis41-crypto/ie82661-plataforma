name: Publicar plataforma en GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar contenido del repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Seleccionar archivos públicos
        run: |
          mkdir -p _site
          cp -a index.html .nojekyll css js imagenes fichas-interactivas evaluaciones recursos 1 _site/

      - name: Preparar archivos del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
